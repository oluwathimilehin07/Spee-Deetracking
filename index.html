<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veho Tracking</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.5;
      color: #333;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #662d91 0%, #8b4db7 100%);
      color: white;
      padding: 1rem 2rem;
      box-shadow: 0 4px 12px rgba(102, 45, 145, 0.3);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 2rem;
      font-weight: bold;
      color: #ffd700;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: #ffd700;
    }

    .tracking-container {
      max-width: 600px;
      margin: 4rem auto;
      padding: 3rem;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      text-align: center;
    }

    .tracking-container h1 {
      font-size: 2.5rem;
      color: #662d91;
      margin-bottom: 1rem;
    }

    .tracking-form {
      display: flex;
      gap: 1rem;
      max-width: 400px;
      margin: 2rem auto;
      flex-wrap: wrap;
    }

    .tracking-input {
      flex: 1;
      padding: 1rem 1.5rem;
      font-size: 1.1rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-family: inherit;
      min-width: 250px;
    }

    .tracking-input:focus {
      outline: none;
      border-color: #ff6c00;
box-shadow: 0 0 0 0 3px rgba(255, 108, 0, 0.1);
    }

    .track-btn {
      background: linear-gradient(135deg, #ff6c00, #ff8c42);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }

    .track-btn:hover {
      transform: translateY(-2px);
box-shadow: 0 8px 25px rgba(255, 108, 0, 0.4);
    }

    .error-message {
      background: #f8d7da;
      color: #721c24;
      padding: 1rem;
      border-radius: 8px;
      border-left: 5px solid #dc3545;
      margin-top: 1rem;
      display: none;
    }

    @media (max-width: 768px) {
      .tracking-form {
        flex-direction: column;
      }

      .track-btn {
        width: 100%;
      }

      .tracking-container {
        margin: 2rem 1rem;
        padding: 2rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo">
        <i class="fas fa-truck"></i> Spee-Dee
      </div>
      <nav>
        <div class="nav-links">
          <a href="#">Track</a>
          <a href="#">Shipping</a>
          <a href="#">Services</a>
          <a href="#">Locations</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="tracking-container">
      <h1>Track Your Package</h1>
      <p style="color: #666; margin-bottom: 2rem; font-size: 1.2rem;">Enter your tracking number to see real-time updates</p>
      
      <form class="tracking-form" onsubmit="handleTrack(event); return false;">
        <input type="text" class="tracking-input" id="trackingId" placeholder="Enter tracking number (e.g. 1Z1234567890)" maxlength="22" required>
        <button type="submit" class="track-btn">
          <i class="fas fa-search"></i> Track Package
        </button>
      </form>

      <div id="errorMsg" class="error-message">
        <i class="fas fa-exclamation-triangle"></i> Package not found. Please check your tracking number and try again.
      </div>
    </section>
  </main>

  <script>
    const VALID_TRACKING_ID = '1ZTFUAZR1349623134';

    function handleTrack(event) {
      event.preventDefault();
      const trackingId = document.getElementById('trackingId').value.trim().toUpperCase();
      const errorMsg = document.getElementById('errorMsg');

      if (trackingId === VALID_TRACKING_ID) {
window.location.href = 'page.html';
      } else {
        errorMsg.style.display = 'block';
        document.getElementById('trackingId').focus();
        setTimeout(() => {
          errorMsg.style.display = 'none';
        }, 5000);
      }
    }

    // Auto focus input
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('trackingId').focus();

      // Enter key support
      document.getElementById('trackingId').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          handleTrack(e);
        }
      });
    });
  </script>
</body>
</html>
